name: AI Swing Advisor

on:
  workflow_dispatch:
  schedule:
    - cron: '10 22 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  advisor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_mobile.txt
      - name: Install
        run: pip install -r requirements_mobile.txt
      - name: Run swing advisor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FUNDAMENTAL_CACHE_HOURS: '20'
          RESEARCH_LIMIT: '40'
          ADVISOR_ALERT_SCORE: '80'
        run: python advisor_run.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
